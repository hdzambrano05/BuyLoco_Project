<section class="cart-section">
  <div class="container">
    <h2 class="fw-bold mb-4">Tu carrito</h2>

    <div *ngIf="items.length === 0" class="empty-cart">
      <p class="lead">Tu carrito está vacío. Agrega productos para comenzar tu compra.</p>
    </div>

    <div *ngIf="items.length > 0" class="cart-grid">
      <div class="cart-items">
        <div class="cart-item" *ngFor="let item of items">
          <img
            class="cart-image"
            [src]="item.imageUrl ? imageUrl + item.imageUrl : 'assets/images/logo.PNG'"
            [alt]="item.name"
          />
          <div class="cart-info">
            <h5 class="mb-1">{{ item.name }}</h5>
            <p class="text-muted mb-2">${{ item.price }}</p>
            <div class="cart-actions">
              <label class="quantity-label">
                Cantidad
                <input
                  type="number"
                  min="1"
                  class="quantity-input"
                  [ngModel]="item.quantity"
                  (ngModelChange)="updateQuantity(item, $event)"
                />
              </label>
              <button class="btn btn-outline-danger btn-sm" (click)="removeItem(item)">
                Quitar
              </button>
            </div>
          </div>
          <div class="cart-subtotal">
            <span>Subtotal</span>
            <strong>${{ item.price * item.quantity }}</strong>
          </div>
        </div>
      </div>

      <aside class="cart-summary">
        <h4 class="fw-bold">Resumen</h4>
        <div class="summary-row">
          <span>Total</span>
          <strong>${{ total }}</strong>
        </div>
        <button class="btn btn-dark btn-lg w-100 mt-3">Continuar con el pago</button>
        <button class="btn btn-link text-danger mt-2" (click)="clearCart()">
          Vaciar carrito
        </button>
      </aside>
    </div>
  </div>
</section>
